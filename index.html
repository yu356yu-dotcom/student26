<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مؤشرات التوجيه الطلابي V2</title>
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
  <section id="loginView" class="auth-shell">
    <div class="auth-card">
      <div class="brand-mark">م</div>
      <h1>مؤشرات التوجيه الطلابي</h1>
      <p>نظام موحد للتوثيق، الملفات، التحليل والتقارير</p>
      <input id="loginEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="username" />
      <input id="loginPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
      <button id="loginBtn" class="btn primary">دخول</button>
      <div id="loginMessage" class="message"></div>
    </div>
  </section>

  <main id="appView" class="hidden">
    <header class="app-header">
      <div>
        <h1>مؤشرات التوجيه الطلابي</h1>
        <p id="schoolLabel">لوحة المدرسة</p>
      </div>
      <div class="header-actions">
        <button id="refreshBtn" class="btn ghost">↻ تحديث</button>
        <button id="printAllBtn" class="btn ghost">🖨 طباعة</button>
        <button id="logoutBtn" class="btn danger">خروج</button>
      </div>
    </header>
<section id="mainSections" class="container">

  <h2>منصة التوجيه الطلابي</h2>

  <div class="main-sections-grid">

    <button type="button" id="openIndicatorsSection" class="main-section-card"
onclick="document.getElementById('indicatorsContainer').classList.remove('hidden'); document.getElementById('indicatorsToolbar').classList.remove('hidden'); document.getElementById('programReportsSection').classList.add('hidden');"      <strong>مؤشرات التوجيه الطلابي</strong>
 <span class="main-section-icon">📊</span>
  
<small>المؤشرات والتحليل والتقارير والمقارنات</small>
    </button>

 <span class="main-section-icon">📋</span>
   
<button type="button" id="openProgramsSection" class="main-section-card"
onclick="document.getElementById('programReportsSection').classList.remove('hidden'); document.getElementById('indicatorsContainer').classList.add('hidden'); document.getElementById('indicatorsToolbar').classList.add('hidden');"      <strong>برامج التوجيه والإرشاد</strong>
      <small>البرامج والتقارير والشواهد والصور</small>
    </button>

  </div>

</section>
<section id="indicatorsSection" class="dashboard container hidden">      <div class="stat"><span id="indicatorCount">0</span><small>المؤشرات</small></div>
      <div class="stat"><span id="analysisCount">0</span><small>تحليلات محفوظة</small></div>
      <div class="stat"><span id="attachmentCount">0</span><small>ملفات مرفوعة</small></div>
      <div class="stat"><span id="lastUpdate">—</span><small>آخر تحديث</small></div>
    </section>

    <section id="indicatorsToolbar" class="toolbar container">
      <input id="searchInput" type="search" placeholder="ابحث في المؤشرات..." />
      <button id="expandAllBtn" class="btn secondary">فتح جميع المؤشرات</button>
    </section>

    <section id="indicatorsContainer" class="container hidden"></section>
<section id="programReportsSection" class="container hidden">
    <h2>📋 تقارير برامج التوجيه والإرشاد</h2>

  <div class="program-report-toolbar">
    <label for="programSelect">اختر البرنامج:</label>

    <select id="programSelect">
      <option value="">-- اختر أحد البرامج --</option>
    </select>
<label for="reportTemplateSelect">اختر قالب التقرير:</label>

<select id="reportTemplateSelect">
  <option value="official">🏛️ النموذج الرسمي الحالي</option>
  <option value="photo">🖼️ النموذج البصري المصور</option>
  <option value="premium">⭐ النموذج المميز</option>
</select>
    <button id="openProgramReportBtn" type="button">
      إنشاء التقرير
    </button>
  </div>
</section>
  </main>

  <div id="analysisModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle">التحليل</h2>
          <p id="modalMeta"></p>
        </div>
        <div class="modal-actions">
          <button id="modalPrintBtn" class="btn secondary">🖨 طباعة</button>
          <button id="modalDownloadBtn" class="btn secondary">⬇ تقرير مستقل</button>
          <button id="modalCloseBtn" class="btn danger">إغلاق</button>
        </div>
      </div>
      <div id="modalAnalysisContent"></div>
      <div id="analysisHistory" style="margin-top:20px;">
  <h3>سجل التحليلات السابقة</h3>
<button id="compareMonthsBtn" class="btn secondary" onclick="compareAllMonths()">  📊 مقارنة جميع الأشهر
</button>
  <div id="analysisHistoryList">
    </div>
  </div>
  </div>
  </div>
<!-- نافذة تقرير البرنامج - تعمل على الجوال والكمبيوتر -->
<div id="programReportModal" class="modal hidden" aria-hidden="true">
  <div class="modal-card program-report-modal-card">

    <div class="modal-head">
      <div>
        <h2 id="programReportModalTitle">تقرير البرنامج</h2>
        <p>تقرير برنامج التوجيه والإرشاد</p>
      </div>

      <div class="modal-actions">
        <button
          id="programReportPrintBtn"
          class="btn secondary"
          type="button">
          🖨️ طباعة
        </button>

        <button
          id="programReportCloseBtn"
          class="btn danger"
          type="button">
          ✕ إغلاق
        </button>
      </div>
    </div>

    <div id="programReportModalContent"></div>

  </div>
</div>
  <script src="js/config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
