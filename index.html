    .indicator-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 14px;
      color: var(--main-color);

      min-height: 140px;
      padding: 12px;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.8;
      border: 1px solid #ccd2d7;
      border-radius: 10px;

    }

    textarea:disabled {

      color: #333;
    }

    .controls {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    input[type="file"] {

    }

    .gallery {
      margin-top: 15px;

      gap: 12px;
    }

    .image-box {
      position: relative;
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
      background: #fafafa;
      padding: 8px;
    }

      width: 100%;

      border-radius: 8px;
    }

    .image-box .delete-btn {
      width: 100%;

    }

    .color-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .locked-note {
      font-size: 13px;
      color: #777;
      margin-top: 7px;

    @media (max-width: 700px) {
      header h1 {

      }

      }

      button {

      .top-controls,
      .color-panel,
      button,

      }

      }

        page-break-inside: avoid;

async function loginWithSupabase() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  if (!email || !password) {
    alert("أدخل البريد الإلكتروني وكلمة المرور");
    return;
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert("تعذر تسجيل الدخول: " + error.message);
    return;
  }

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("mainSite").style.display = "block";

  alert("تم تسجيل الدخول بنجاح ✅");
}

async function logoutSupabase() {
  await supabaseClient.auth.signOut();
  location.reload();
}

async function checkSupabaseSession() {
  const { data } = await supabaseClient.auth.getSession();

  if (data.session) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("mainSite").style.display = "block";
  }
}

window.addEventListener("load", checkSupabaseSession);

function connectDataSource(index) {
  const input = document.createElement("input");

  input.type = "file";
  input.accept = ".xlsx,.xls,.csv";

  input.onchange = function () {
    const file = input.files[0];

    if (!file) return;

    handleExcelFile(index, file);
  };

  input.click();
}

function handleExcelFile(index, file) {
  const reader = new FileReader();

  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);

      const workbook = XLSX.read(data, {
        type: "array"
      });

      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];

      const rows = XLSX.utils.sheet_to_json(
        worksheet,
        {
          header: 1,
          defval: ""
        }
      );

      const headers = rows.length > 0 ? rows[0] : [];
      const dataRows = rows.slice(1);

      window.excelData = window.excelData || {};
      window.excelData[index] = {
        fileName: file.name,
        sheetName: firstSheetName,
        headers: headers,
        rows: dataRows
      };

      alert(
        "تمت قراءة ملف Excel بنجاح ✅" +
        "\n\nالمؤشر رقم: " + (index + 1) +
        "\nاسم الملف: " + file.name +
        "\nاسم الورقة: " + firstSheetName +
        "\nعدد الأعمدة: " + headers.length +
        "\nعدد الصفوف: " + dataRows.length
      );
      analyzeIndicator(index);

    } catch (error) {
      console.error("Excel Error:", error);
alert("خطأ Excel: " + error.message);

      alert(
        "تعذر قراءة ملف Excel.\n" +
        "تأكد أن الملف بصيغة xlsx أو xls أو csv."
      );
    }
  };

  reader.readAsArrayBuffer(file);
}
function analyzeIndicator(index) {
  const excel = window.excelData && window.excelData[index];

  if (!excel || !excel.rows || excel.rows.length === 0) {
    alert("يرجى ربط ملف Excel بالمؤشر أولاً");
    return;
  }

  const headers = excel.headers || [];
  const rows = excel.rows.filter(row =>
    row && row.some(cell => String(cell ?? "").trim() !== "")
  );

  const totalRows = rows.length;
  const totalColumns = headers.length;

  // البحث عن الأعمدة المناسبة للتحليل
  const columnStats = headers.map((header, colIndex) => {
    const values = rows
      .map(row => String(row[colIndex] ?? "").trim())
      .filter(v => v !== "");

    const counts = {};
    values.forEach(v => {
      counts[v] = (counts[v] || 0) + 1;
    });

    const uniqueCount = Object.keys(counts).length;

    return {
      header: String(header || "عمود " + (colIndex + 1)),
      colIndex,
      values,
      counts,
      uniqueCount
    };
  });

  // اختيار أفضل الأعمدة التصنيفية مثل الشعبة والحالة والصف
  const preferredWords = [
    "شعبة", "الشعبة",
    "صف", "الصف",
    "مرحلة", "المرحلة",
    "حالة", "الحالة",
    "نوع", "التصنيف",
    "غياب", "حضور"
  ];

  const categorical = columnStats
    .filter(c => c.uniqueCount >= 2 && c.uniqueCount <= 15)
    .sort((a, b) => {
      const aScore = preferredWords.some(w => a.header.includes(w)) ? 1 : 0;
      const bScore = preferredWords.some(w => b.header.includes(w)) ? 1 : 0;
      return bScore - aScore;
    })
    .slice(0, 3);

  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function createBars(column) {
    const entries = Object.entries(column.counts)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 10);

    const max = Math.max(...entries.map(e => e[1]), 1);

    return entries.map(([name, count]) => {
      const percent = Math.round((count / max) * 100);
      const share = totalRows
        ? ((count / totalRows) * 100).toFixed(1)
        : 0;

      return `
        <div style="margin:12px 0;">
          <div style="
            display:flex;
            justify-content:space-between;
            gap:15px;
            margin-bottom:5px;
            font-size:14px;">
            <strong>${escapeHTML(name)}</strong>
            <span>${count} (${share}%)</span>
          </div>

          <div style="
            height:20px;
            background:#e9eeee;
            border-radius:10px;
            overflow:hidden;">
            <div style="
              width:${percent}%;
              height:100%;
              background:linear-gradient(90deg,#0f766e,#14b8a6);
              border-radius:10px;">
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  let chartsHTML = "";

  categorical.forEach(column => {
    chartsHTML += `
      <div style="
        background:white;
        border:1px solid #e5e7eb;
        border-radius:16px;
        padding:20px;
        margin-top:18px;">
        <h3 style="margin-top:0;color:#0f766e;">
          تحليل ${escapeHTML(column.header)}
        </h3>
        ${createBars(column)}
      </div>
    `;
  });

  let insights = [];

  categorical.forEach(column => {
    const entries = Object.entries(column.counts)
      .sort((a, b) => b[1] - a[1]);

    if (entries.length > 0) {
      insights.push(
        `أعلى قيمة في ${column.header}: ${entries[0][0]} بعدد ${entries[0][1]} سجل`
      );
    }
  });

  if (insights.length === 0) {
    insights.push("تمت قراءة البيانات بنجاح، ولم يتم العثور على عمود تصنيفي مناسب للرسم.");
  }

  let oldModal = document.getElementById("analysis-modal-" + index);
  if (oldModal) oldModal.remove();

  const modal = document.createElement("div");
  modal.id = "analysis-modal-" + index;

  modal.style.cssText = `
    position:fixed;
    inset:0;
    z-index:99999;
    background:rgba(0,0,0,.55);
    overflow:auto;
    padding:25px;
    direction:rtl;
    font-family:Arial,Tahoma,sans-serif;
  `;

  modal.innerHTML = `
    <div style="
      max-width:1100px;
      margin:auto;
      background:#f8fafc;
      border-radius:20px;
      padding:25px;
      box-shadow:0 20px 60px rgba(0,0,0,.25);">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        flex-wrap:wrap;
        gap:12px;
        margin-bottom:20px;">

        <div>
          <h2 style="margin:0;color:#134e4a;">
            📊 التحليل الذكي للمؤشر رقم ${index + 1}
          </h2>

          <div style="margin-top:6px;color:#64748b;">
            ${escapeHTML(excel.fileName || "")}
          </div>
        </div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button onclick="printAnalysisReport(${index})"
            style="padding:10px 16px;border:0;border-radius:10px;cursor:pointer;">
            🖨️ طباعة
          </button>

          <button onclick="printAnalysisReport(${index})"
            style="padding:10px 16px;border:0;border-radius:10px;background:#0f766e;color:white;cursor:pointer;">
            📄 حفظ PDF
          </button>

          <button onclick="downloadAnalysisReport(${index})"
            style="padding:10px 16px;border:0;border-radius:10px;background:#1d4ed8;color:white;cursor:pointer;">
            ⬇️ تقرير مستقل
          </button>

          <button onclick="document.getElementById('analysis-modal-${index}').remove()"
            style="padding:10px 16px;border:0;border-radius:10px;background:#b91c1c;color:white;cursor:pointer;">
            ✕ إغلاق
          </button>
        </div>
      </div>

      <div id="analysis-report-${index}">

        <div style="
          display:grid;

async function addImages(index, files) {
  if (!files || files.length === 0) return;
const selectedFiles = Array.from(files);

const excelFiles = selectedFiles.filter(file => {
  const name = file.name.toLowerCase();
  return name.endsWith(".xlsx") ||
         name.endsWith(".xls") ||
         name.endsWith(".csv");
});

if (excelFiles.length > 0) {
  excelFiles.forEach(file => handleExcelFile(index, file));

  // إذا كان الاختيار يحتوي Excel فقط، لا نكمل إلى رفع المرفقات
  const otherFiles = selectedFiles.filter(file => !excelFiles.includes(file));
  if (otherFiles.length === 0) return;

  files = otherFiles;
}
  const allowedTypes = [
  "application/pdf",
  "application/msword",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  "application/vnd.ms-excel",
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  "text/csv"
];


  const { data: sessionData } = await supabaseClient.auth.getSession();
  const session = sessionData.session;

  if (!session) {
    alert("يجب تسجيل الدخول أولاً");
    return;
  }

  const { data: membership, error: membershipError } = await supabaseClient
    .from("school_memberships")
    .select("school_id")
    .eq("user_id", session.user.id)
    .single();

  if (membershipError || !membership) {
    alert("تعذر تحديد المدرسة المرتبطة بالحساب");
    return;
  }

  const schoolId = membership.school_id;

  for (const file of Array.from(files)) {
    const allowed =
      file.type.startsWith("image/") ||
      allowedTypes.includes(file.type);

    if (!allowed) {
      alert("الملف غير مدعوم: " + file.name);
      continue;
    }

    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const filePath =
      schoolId + "/" +
      index + "/" +
      Date.now() + "_" +
      safeName;

    const { error: uploadError } = await supabaseClient.storage
      .from("indicator-files")
      .upload(filePath, file, {
        contentType: file.type,
        upsert: false
      });

    if (uploadError) {
      alert("تعذر رفع الملف: " + uploadError.message);
      continue;
    }

    const { error: dbError } = await supabaseClient
      .from("indicator_attachments")
      .insert({
        indicator_index: index,
        file_name: file.name,
        file_path: filePath,
        mime_type: file.type,
        file_size: file.size,
        created_by: session.user.id,
        school_id: schoolId
      });

    if (dbError) {
      await supabaseClient.storage
        .from("indicator-files")
        .remove([filePath]);

      alert("تعذر حفظ بيانات الملف: " + dbError.message);
      continue;
    }
  }

  document.getElementById("file-" + index).value = "";

  await displayImages(index);

  alert("تم رفع الملفات بنجاح ✅");
}
  
        

 async function displayImages(index) {
  const gallery = document.getElementById("gallery-" + index);
  if (!gallery) return;

  gallery.innerHTML = "جاري تحميل الملفات...";

  const { data: attachments, error } = await supabaseClient
    .from("indicator_attachments")
    .select("*")
    .eq("indicator_index", index)
    .order("created_at", { ascending: true });

  if (error) {
    gallery.innerHTML = "تعذر تحميل الملفات";
    console.error(error);
    return;
  }

  gallery.innerHTML = "";

  if (!attachments || attachments.length === 0) {
    return;
  }

  for (const attachment of attachments) {
    const { data: signedData, error: urlError } =
      await supabaseClient.storage
        .from("indicator-files")
        .createSignedUrl(attachment.file_path, 3600);

    if (urlError || !signedData) {
      console.error(urlError);
      continue;
    }

    const box = document.createElement("div");
    box.className = "image-box";

    if (
      attachment.mime_type &&
      attachment.mime_type.startsWith("image/")
    ) {
      const img = document.createElement("img");
      img.src = signedData.signedUrl;
      img.alt = attachment.file_name;
      box.appendChild(img);
    } else {
      const fileBox = document.createElement("div");
      fileBox.style.padding = "15px";
      fileBox.style.textAlign = "center";
      fileBox.style.border = "1px solid #ddd";
      fileBox.style.borderRadius = "8px";

      const icon = document.createElement("div");
      icon.style.fontSize = "35px";
      icon.textContent =
        attachment.mime_type === "application/pdf" ? "📕" : "📄";

      const name = document.createElement("div");
      name.textContent = attachment.file_name;

      const link = document.createElement("a");
      link.href = signedData.signedUrl;
      link.target = "_blank";
      link.textContent = "فتح الملف";

      fileBox.appendChild(icon);
      fileBox.appendChild(name);
      fileBox.appendChild(link);

      box.appendChild(fileBox);
    }
const deleteBtn = document.createElement("button");
deleteBtn.textContent = "حذف";
deleteBtn.className = "delete-btn";

deleteBtn.onclick = function () {
  deleteImage(
    index,
    attachment.id,
    attachment.file_path
  );
};

box.appendChild(deleteBtn);
    gallery.appendChild(box);
  }
}
   async function deleteImage(index, attachmentId, filePath) {
  const ok = confirm("هل تريد حذف هذا الملف؟");
  if (!ok) return;

  const { data: sessionData } = await supabaseClient.auth.getSession();

  if (!sessionData.session) {
    alert("يجب تسجيل الدخول أولاً");
    return;
  }

  const { error: storageError } = await supabaseClient.storage
    .from("indicator-files")
    .remove([filePath]);

  if (storageError) {
    alert("تعذر حذف الملف من التخزين: " + storageError.message);
    return;
  }

  const { error: dbError } = await supabaseClient
    .from("indicator_attachments")
    .delete()
    .eq("id", attachmentId);

  if (dbError) {
    alert("تم حذف الملف ولكن تعذر حذف بياناته: " + dbError.message);
    return;
  }

  await displayImages(index);

  alert("تم حذف الملف بنجاح ✅");
}

      return;
    }

    const mainColor =

    const backgroundColor =
      document.getElementById("backgroundColor").value;

    document.documentElement.style.setProperty(
      "--main-color",

    );

    document.documentElement.style.setProperty(
      "--background-color",

    );

    localStorage.setItem(
      "mainColor",

    );

    localStorage.setItem(
      "backgroundColor",

    );
  }

  function resetColors() {
    if (!checkPassword()) {
      alert("كلمة المرور غير صحيحة");
      return;
    }

    localStorage.removeItem("mainColor");
    localStorage.removeItem("backgroundColor");

    document.documentElement.style.setProperty(
      "--main-color",
      "#1f6f5f"
    );

    document.documentElement.style.setProperty(
      "--background-color",
      "#f5f7f8"
    );

    document.getElementById("mainColor").value =
      "#1f6f5f";

    document.getElementById("backgroundColor").value =
      "#f5f7f8";
  }

  function loadColors() {
    const mainColor =
      localStorage.getItem("mainColor");

    const backgroundColor =
      localStorage.getItem("backgroundColor");

    if (mainColor) {
      document.documentElement.style.setProperty(
        "--main-color",
        mainColor
      );

      document.getElementById("mainColor").value =
        mainColor;
    }

    if (backgroundColor) {
      document.documentElement.style.setProperty(
        "--background-color",
        backgroundColor
      );

      document.getElementById(
        "backgroundColor"
      ).value = backgroundColor;
    }
  }
