      color: #222;

    header {
      background: var(--main-color);

      font-size: 20px;
      font-weight: bold;
      margin-bottom: 14px;
      color: var(--main-color);
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 12px;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.8;
      border: 1px solid #ccd2d7;
      border-radius: 10px;
      resize: vertical;
      background: #fafafa;
    }

    textarea:disabled {
      background: #f1f3f4;
      color: #333;
    }

    .controls {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    input[type="file"] {
      margin-top: 12px;
    }

    .gallery {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
    }

    .image-box {
      position: relative;
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
      background: #fafafa;
      padding: 8px;
    }

    .image-box img {
      width: 100%;
      display: block;
      border-radius: 8px;
    }

    .image-box .delete-btn {
      width: 100%;
      margin-top: 7px;
    }

    .color-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .locked-note {
      font-size: 13px;
      color: #777;
      margin-top: 7px;
    }

    @media (max-width: 700px) {
      header h1 {
        font-size: 22px;
      }

      .indicator-title {
        font-size: 18px;
      }

      button {
        width: 100%;
      }
    }

    @media print {
      .top-controls,
      .color-panel,
      button,
      input[type="file"],
      .delete-btn {
        display: none !important;
      }

      body {

      }

        border: 1px solid #ccc;

function connectDataSource(index) {
  const input = document.createElement("input");

  input.type = "file";
  input.accept = ".xlsx,.xls,.csv";

  input.onchange = function () {
    const file = input.files[0];

    if (!file) return;

    handleExcelFile(index, file);
  };

  input.click();
}

function handleExcelFile(index, file) {
  const reader = new FileReader();

  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);

      const workbook = XLSX.read(data, {
        type: "array"
      });

      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];

      const rows = XLSX.utils.sheet_to_json(
        worksheet,
        {
          header: 1,
          defval: ""
        }
      );

      const headers = rows.length > 0 ? rows[0] : [];
      const dataRows = rows.slice(1);

      window.excelData = window.excelData || {};
      window.excelData[index] = {
        fileName: file.name,
        sheetName: firstSheetName,
        headers: headers,
        rows: dataRows
      };

      alert(
        "تمت قراءة ملف Excel بنجاح ✅" +
        "\n\nالمؤشر رقم: " + (index + 1) +
        "\nاسم الملف: " + file.name +
        "\nاسم الورقة: " + firstSheetName +
        "\nعدد الأعمدة: " + headers.length +
        "\nعدد الصفوف: " + dataRows.length
      );

    } catch (error) {
      console.error(error);

      alert(
        "تعذر قراءة ملف Excel.\n" +
        "تأكد أن الملف بصيغة xlsx أو xls أو csv."
      );
    }
  };

  reader.readAsArrayBuffer(file);
}

function addImages(index, files) {
  if (!files || files.length === 0) return;

  const allowedTypes = [
    "application/pdf",
    "application/msword",
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
  ];

  const attachments = JSON.parse(
    localStorage.getItem("images_" + index) || "[]"
  );

  Array.from(files).forEach(file => {
    const allowed =
      file.type.startsWith("image/") ||
      allowedTypes.includes(file.type);

    if (!allowed) {
      alert("الملف غير مدعوم: " + file.name);
      return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {
      attachments.push({
        name: file.name,
        type: file.type,
        data: event.target.result
      });

      try {
        localStorage.setItem(
          "images_" + index,
          JSON.stringify(attachments)
        );

        displayImages(index);
      } catch (error) {
        alert("تعذر حفظ الملف. قد يكون حجم الملف كبيرًا جدًا.");
      }
    };

    reader.readAsDataURL(file);
  });
}

        

  function displayImages(index) {
  const gallery = document.getElementById("gallery-" + index);

  if (!gallery) return;

  gallery.innerHTML = "";

  const attachments = JSON.parse(
    localStorage.getItem("images_" + index) || "[]"
  );

  attachments.forEach((item, fileIndex) => {

    const attachment =
      typeof item === "string"
        ? {
            name: "صورة " + (fileIndex + 1),
            type: "image/jpeg",
            data: item
          }
        : item;

    const box = document.createElement("div");
    box.className = "image-box";

    if (
      attachment.type &&
      attachment.type.startsWith("image/")
    ) {
      const img = document.createElement("img");

      img.src = attachment.data;
      img.alt = attachment.name;

      box.appendChild(img);

    } else {

      const fileBox = document.createElement("div");

      fileBox.style.padding = "15px";
      fileBox.style.textAlign = "center";
      fileBox.style.border = "1px solid #ddd";
      fileBox.style.borderRadius = "8px";

      const icon = document.createElement("div");
      icon.style.fontSize = "35px";

      icon.textContent =
        attachment.type === "application/pdf"
          ? "📕"
          : "📄";

      const name = document.createElement("div");
      name.textContent = attachment.name;
      name.style.margin = "8px";

      const link = document.createElement("a");
      link.href = attachment.data;
      link.download = attachment.name;
      link.target = "_blank";
      link.textContent = "فتح / تنزيل الملف";

      fileBox.appendChild(icon);
      fileBox.appendChild(name);
      fileBox.appendChild(link);

      box.appendChild(fileBox);
    }

    const deleteBtn = document.createElement("button");

    deleteBtn.className = "delete-btn";
    deleteBtn.textContent = "حذف المرفق";

    deleteBtn.onclick = function() {
      deleteImage(index, fileIndex);
    };

    box.appendChild(deleteBtn);
    gallery.appendChild(box);
  });

            margin-bottom: 18px;
            text-align: center;
            page-break-inside: avoid;
          }

          .print-image img {
            max-width: 100%;
            max-height: 650px;
            object-fit: contain;
            border-radius: 8px;
          }

          .footer {
            margin-top: 30px;
            border-top: 1px solid #ccc;
            padding-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #666;
          }

          @media print {
            body {
              padding: 15px;
            }
          }

        </style>
      </head>

      <body>

        <div class="school-header">

          <h1>
            تقرير مؤشرات التوجيه الطلابي
          </h1>

          <p>
            ثانوية مجمع الأمير فهد بن سلطان
          </p>

        </div>

        <div class="indicator-number">
          المؤشر رقم ${index + 1}
        </div>

        <div class="indicator-title">
          ${item.title}
        </div>

        <div class="section-title">
          التقرير
        </div>

        <div class="report-box">
          ${report}
        </div>

        ${
          images.length > 0
          ?
          `
            <div class="section-title">
              الشواهد والصور
            </div>

            <div class="images-container">
              ${imagesHTML}
            </div>
          `
          :
          `
            <div class="section-title">
              الشواهد والصور
            </div>

            <p>
              لا توجد صور مرفقة لهذا المؤشر.
            </p>
          `
        }

        <div class="footer">
          نظام توثيق مؤشرات التوجيه الطلابي
        </div>

        <script>
          window.onload = function() {
            setTimeout(function() {
              window.print();
            }, 300);
          };
        <\/script>

      </body>

      </html>
    `);

    printWindow.document.close();
  }

  document.addEventListener(
    "DOMContentLoaded",
    function() {
      createIndicators();
      loadColors();
    }
  );
</script>

</body>
</html>
